<!doctype html>
<html><head><meta charset="utf-8"><title>Logo · primary mark</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .stage {
    background:
      radial-gradient(ellipse at 50% 55%, rgba(63,202,230,0.10) 0%, transparent 60%),
      var(--color-bg);
    min-height: 320px;
    display: grid; place-items: center;
    padding: 24px;
    border-bottom: 1px solid var(--color-border);
  }
  .row { display: flex; align-items: center; gap: 22px; }
  .mark { width: 140px; height: 140px; }
  .word {
    font-family: var(--font-display); font-weight: 700; font-size: 36px;
    letter-spacing: 0.04em;
    color: var(--color-fg);
    line-height: 1;
  }
  .word .arc { color: #3FCAE6; }
  .meta {
    margin-top: 6px;
    font-family: var(--font-body); font-size: 13px;
    color: var(--color-fg-muted);
    letter-spacing: 0.02em;
  }
</style></head>
<body>
  <div class="stage">
    <div class="row">
      <img class="mark" src="../assets/logo-detailed.svg" alt="LevelArc">
      <div>
        <div class="word">LEVEL<span class="arc">ARC</span></div>
        <div class="meta">Primary lockup · mark + wordmark</div>
      </div>
    </div>
  </div>
</body></html>
