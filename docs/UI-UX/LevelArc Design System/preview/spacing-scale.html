<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--color-border); }
  .row:last-child { border-bottom: 0; }
  .name { width: 80px; font-family: var(--font-display); font-weight: 500; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg); }
  .px { width: 60px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--color-fg-muted); }
  .bar { height: 14px; background: var(--color-primary); border-radius: 2px; }
  .token { color: var(--color-fg-muted); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; margin-left: auto; }
</style></head>
<body>
  <div class="row"><div class="name">xs</div><div class="px">4 px</div><div class="bar" style="width:4px"></div><div class="token">--space-xs</div></div>
  <div class="row"><div class="name">sm</div><div class="px">8 px</div><div class="bar" style="width:8px"></div><div class="token">--space-sm</div></div>
  <div class="row"><div class="name">md</div><div class="px">16 px</div><div class="bar" style="width:16px"></div><div class="token">--space-md</div></div>
  <div class="row"><div class="name">lg</div><div class="px">24 px</div><div class="bar" style="width:24px"></div><div class="token">--space-lg</div></div>
  <div class="row"><div class="name">xl</div><div class="px">32 px</div><div class="bar" style="width:32px"></div><div class="token">--space-xl</div></div>
</body></html>
