<!doctype html>
<html><head><meta charset="utf-8"><title>State colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sw {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--color-card);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 10px;
    border-radius: var(--radius-sm);
    border: 1px solid currentColor;
    font-family: var(--font-display); font-weight: 500; font-size: 11px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .name { font-size: 12px; color: var(--color-fg); font-weight: 500; }
  .hex { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--color-fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="sw" style="color:#3DD68C">
      <span class="pill"><span class="dot"></span>Complete</span>
      <div><div class="name">success</div><div class="hex">#3DD68C</div></div>
    </div>
    <div class="sw" style="color:#FF6B6B">
      <span class="pill"><span class="dot"></span>Failed</span>
      <div><div class="name">danger</div><div class="hex">#FF6B6B</div></div>
    </div>
    <div class="sw" style="color:#FFA94D">
      <span class="pill"><span class="dot"></span>Streak</span>
      <div><div class="name">streak</div><div class="hex">#FFA94D</div></div>
    </div>
  </div>
</body></html>
