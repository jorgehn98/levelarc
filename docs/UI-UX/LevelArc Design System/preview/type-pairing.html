<!doctype html>
<html><head><meta charset="utf-8"><title>Type pairing</title>
<link rel="stylesheet" href="_card.css">
<style>
  .panel {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sys { font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-primary); }
  .h { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 34px; color: var(--color-fg); margin: 0; }
  .b { font-family: var(--font-body); font-size: 15px; line-height: 21px; color: var(--color-fg); margin: 0; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--color-fg-muted); margin: 0; }
  .rule { color: var(--color-fg-muted); font-size: 12px; margin-top: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style></head>
<body>
  <div class="panel">
    <div class="sys">SYSTEM · NOTIFICACIÓN</div>
    <h2 class="h">Rango ascendido a D</h2>
    <p class="b">Has alcanzado el siguiente nivel de jugador. Tu XP máximo y multiplicadores se ajustan en consecuencia.</p>
    <p class="meta">Hoy · 21:04</p>
  </div>
  <div class="rule">Orbitron — title &amp; system label only. Inter — body &amp; meta.</div>
</body></html>
