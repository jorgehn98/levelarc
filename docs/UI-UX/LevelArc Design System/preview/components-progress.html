<!doctype html>
<html><head><meta charset="utf-8"><title>Progress bars</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .lbl { font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg); }
  .val { font-family: var(--font-display); font-weight: 500; font-size: 12px; color: var(--color-fg-muted); }
  .track { height: 8px; background: var(--color-card); border-radius: var(--radius-sm); overflow: hidden; }
  .fill { height: 100%; border-radius: var(--radius-sm); }
  .meta { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--color-fg-muted); }
</style></head>
<body>
  <div class="stack">
    <div class="row">
      <div class="head"><span class="lbl">XP · Rank D</span><span class="val">240 / 600</span></div>
      <div class="track"><div class="fill" style="width:40%;background:#4DB8C4;box-shadow:0 0 12px rgba(77,184,196,0.5)"></div></div>
      <div class="meta">rank-d fill · uses current rank color</div>
    </div>
    <div class="row">
      <div class="head"><span class="lbl">Mission</span><span class="val">3 / 5</span></div>
      <div class="track"><div class="fill" style="width:60%;background:var(--color-primary)"></div></div>
      <div class="meta">cyan fill · default mission progress</div>
    </div>
  </div>
</body></html>
