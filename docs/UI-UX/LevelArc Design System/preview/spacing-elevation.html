<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation & glow</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cell {
    border-radius: var(--radius-md);
    padding: 16px;
    background: var(--color-card);
    display: flex; flex-direction: column; gap: 8px;
    min-height: 96px;
    justify-content: center;
  }
  .flat { border: 1px solid var(--color-border); }
  .focus { border: 1px solid var(--color-primary); box-shadow: var(--glow-primary); }
  .rank-up { border: 1px solid #F5C542; color: #F5C542; box-shadow: 0 0 0 1px #F5C542, 0 0 28px rgba(245,197,66,0.35); }
  .name { font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg); }
  .meta { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--color-fg-muted); }
  .rank-up .name { color: #F5C542; }
</style></head>
<body>
  <div class="grid">
    <div class="cell flat"><div class="name">Flat · default</div><div class="meta">1px border, no shadow</div></div>
    <div class="cell focus"><div class="name" style="color:var(--color-primary)">Focus / active</div><div class="meta">--glow-primary</div></div>
    <div class="cell rank-up"><div class="name">Rank-up</div><div class="meta">--glow-rank · rare moments</div></div>
  </div>
</body></html>
