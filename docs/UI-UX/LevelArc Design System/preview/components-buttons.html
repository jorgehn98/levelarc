<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    height: 44px; padding: 0 18px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    font-family: var(--font-body); font-weight: 500; font-size: 14px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-system), transform var(--dur-fast) var(--ease-system);
  }
  .btn:active { transform: scale(0.97); }
  .primary { background: var(--color-primary); color: var(--color-fg-on-primary); }
  .primary:hover { background: var(--color-primary-glow); }
  .secondary { background: var(--color-card); color: var(--color-fg); border-color: var(--color-border); }
  .secondary:hover { background: #23232F; }
  .danger { background: var(--color-card); color: var(--color-danger); border-color: var(--color-danger); }
  .ghost { background: transparent; color: var(--color-primary); }
  .iconbtn {
    width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center;
    background: var(--color-card); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); color: var(--color-fg);
  }
  .label { font-family: var(--font-display); font-weight: 500; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-muted); margin-bottom: 6px; }
</style></head>
<body>
  <div class="label">Buttons · 44 high · 8 radius</div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn primary">Completar</button>
    <button class="btn secondary">Archivar</button>
    <button class="btn danger">Fallar</button>
    <button class="btn ghost">Ver detalle</button>
    <button class="iconbtn" aria-label="add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</body></html>
