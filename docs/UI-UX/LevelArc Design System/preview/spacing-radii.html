<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cell {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 14px;
    background: var(--color-card);
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  }
  .box { width: 100%; height: 64px; background: var(--color-surface); border: 1px solid var(--color-border); }
  .name { font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg); }
  .meta { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--color-fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:0"></div><div class="name">sharp</div><div class="meta">0 px · dividers, hairlines</div></div>
    <div class="cell"><div class="box" style="border-radius:4px"></div><div class="name">sm · 4 px</div><div class="meta">--radius-sm · bars, chips</div></div>
    <div class="cell"><div class="box" style="border-radius:8px"></div><div class="name">md · 8 px</div><div class="meta">--radius-md · default</div></div>
  </div>
</body></html>
